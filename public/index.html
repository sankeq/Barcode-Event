<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <title>Barcode Peserta Event</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f766e'/%3E%3Cg fill='%23fff'%3E%3Crect x='6' y='8' width='3' height='16'/%3E%3Crect x='11' y='8' width='2' height='16'/%3E%3Crect x='15' y='8' width='4' height='16'/%3E%3Crect x='21' y='8' width='2' height='16'/%3E%3Crect x='25' y='8' width='2' height='16'/%3E%3C/g%3E%3C/svg%3E" />
  </head>
  <body>
    <!-- Layar masuk -->
    <div id="layar-masuk" class="layar-masuk" hidden>
      <form class="kartu-masuk" id="form-masuk" autocomplete="on">
        <div class="merek">
          <span class="merek-ikon" aria-hidden="true">▮▯▮</span>
          <div>
            <strong>Barcode Peserta</strong>
            <small id="masuk-nama-event">Event</small>
          </div>
        </div>
        <h1>Masuk Panitia</h1>
        <p class="muted">Gunakan akun Admin atau Petugas yang diberikan panitia.</p>

        <label class="bidang">
          <span>Nama pengguna</span>
          <input name="username" type="text" required autocomplete="username" autocapitalize="none" />
        </label>
        <label class="bidang">
          <span>Kata sandi</span>
          <input name="password" type="password" required autocomplete="current-password" />
        </label>

        <div id="masuk-error" class="pesan-galat" hidden></div>

        <button class="tombol utama lebar" type="submit" id="tombol-masuk">Masuk</button>

        <div class="contoh-akun">
          <span class="muted">Akun contoh:</span>
          <button type="button" class="tautan-kecil" data-isi="admin|admin123">Admin</button>
          <button type="button" class="tautan-kecil" data-isi="petugas|petugas123">Petugas</button>
        </div>
      </form>
    </div>

    <!-- Kerangka aplikasi -->
    <div id="aplikasi" class="aplikasi" hidden>
      <header class="topbar">
        <button class="tombol ikon" id="tombol-menu" aria-label="Buka menu">☰</button>
        <div class="topbar-judul">
          <strong id="nama-event-top">Event</strong>
          <span class="muted" id="nama-halaman-top">Dasbor</span>
        </div>
        <div class="topbar-kanan">
          <span class="lencana-peran" id="lencana-peran">Admin</span>
          <span class="nama-pengguna" id="nama-pengguna-top">-</span>
          <button class="tombol kecil" id="tombol-keluar">Keluar</button>
        </div>
      </header>

      <div class="isi">
        <nav class="sidebar" id="sidebar">
          <div class="sidebar-merek">
            <span class="merek-ikon" aria-hidden="true">▮▯▮</span>
            <div>
              <strong>Barcode Peserta</strong>
              <small class="muted" id="sidebar-sub">Panel Panitia</small>
            </div>
          </div>
          <ul class="menu" id="menu"></ul>
          <div class="sidebar-kaki">
            <button class="tautan-kecil" id="tombol-ganti-sandi">Ganti kata sandi saya</button>
          </div>
        </nav>

        <main class="konten" id="konten">
          <div class="pemuat">Memuat…</div>
        </main>
      </div>
    </div>

    <!-- Notifikasi -->
    <div id="wadah-notifikasi" class="wadah-notifikasi" aria-live="polite"></div>

    <!-- Dialog umum -->
    <dialog id="dialog" class="dialog-dasar">
      <div id="dialog-isi" class="dialog-isi"></div>
    </dialog>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
